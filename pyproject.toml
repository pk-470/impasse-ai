[project]
name = "impasse"
version = "1.0.0"
description = "Alpha-beta search engine and pygame GUI for Mark Steere's board game Impasse."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "pk-470", email = "parmenkouts99@gmail.com" }]
keywords = ["alpha-beta", "board-game", "game-ai", "impasse", "pygame"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = ["mypy-extensions>=1.0", "platformdirs>=4.0", "pygame>=2.6"]

[project.scripts]
impasse = "impasse.__main__:main"

[project.urls]
"Game rules" = "https://www.marksteeregames.com/Impasse_rules.pdf"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["impasse*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["scripts", "src", "tests"]
exclude = ["**/.*_cache", "**/__pycache__", "**/build", "**/dist"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=9.1.1", "setuptools>=70"]
